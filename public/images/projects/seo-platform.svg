<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="SEO automation workflow">
  <rect width="1200" height="720" rx="36" fill="#24221e"/>
  <text x="64" y="86" fill="#E8D2B5" font-family="Georgia, serif" font-size="42">Content automation</text>
  <text x="64" y="128" fill="#A5A79B" font-family="Arial, sans-serif" font-size="20">Validate, assess, publish, then monitor</text>
  <g font-family="Arial, sans-serif" font-size="20" fill="#1c1b19">
    <rect x="64" y="220" width="180" height="88" rx="18" fill="#E8D2B5"/><text x="92" y="270">Validate</text>
